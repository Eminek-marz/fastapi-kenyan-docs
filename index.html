<!DOCTYPE html>
<html lang="sw-KE">
<head>
  <meta charset="UTF-8">
  <title>FastAPI - Mwongozo wa Kiswahili cha Kenya 🇰🇪</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Mwongozo wa kisasa wa kujifunza FastAPI kwa Kiswahili cha Kenya bila deep translation.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #009688;
      --theme-color-dark: #00796b;
    }
    .app-name-link {
      font-weight: 800;
      font-size: 1.25rem !important;
      color: #009688 !important;
    }
    .sidebar-nav li strong {
      color: #1f2937;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .markdown-section code {
      color: #00796b;
      font-weight: 600;
      background-color: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .markdown-section pre > code {
      color: #f8fafc;
      background-color: #1e293b;
      font-weight: normal;
    }
    .kenyan-tag {
      display: inline-block;
      background: #009688;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge-tip {
      background: #e6fffa;
      border-left: 4px solid #009688;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin: 1.5em 0;
    }
  </style>
</head>
<body>
  <div id="app">Inapakia Mwongozo wa FastAPI... ⚡</div>
  <script>
    window.$docsify = {
      name: '⚡ FastAPI Kenya 🇰🇪',
      repo: 'https://github.com/Eminek-marz',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Tafuta mada ya FastAPI...',
        noData: 'Hakuna matokeo yaliyopatikana!',
        depth: 4
      },
      pagination: {
        previousText: 'Moduli Iliyopita',
        nextText: 'Moduli Inayofuata',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Nakili Code',
        errorText: 'Imefeli',
        successText: 'Imenakiliwa!'
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Prism Syntax Highlighting for Python, Bash, JSON -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
